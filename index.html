// ── NOMINATIM GEOCODING (real API, any city worldwide) ──────────────────────
var sT=null,lastQ='';
function onCityType(v){
  clearTimeout(sT);
  if(v.length<2){hideSugg();return;}
  // Show searching indicator immediately
  var box=document.getElementById('sugg_box');
  box.innerHTML='<div class="sugg-searching">🔍 Searching...</div>';
  box.style.display='block';
  sT=setTimeout(function(){doGeoSearch(v);},500);
}
function doGeoSearch(q){
  if(q===lastQ)return;lastQ=q;
  // Search with Nominatim — works for any city/town/village worldwide
  var url='https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+
    '&format=json&limit=8&addressdetails=1&featuretype=city,town,village,hamlet,suburb&accept-language=en';
  fetch(url,{headers:{'User-Agent':'VedicNumerologyApp/1.0','Accept-Language':'en'}})
  .then(function(r){return r.json();})
  .then(function(data){showSuggNominatim(data);})
  .catch(function(){
    document.getElementById('sugg_box').innerHTML='<div class="sugg-searching">Connection issue. Please enter coordinates manually.</div>';
  });
}
function showSuggNominatim(data){
  var box=document.getElementById('sugg_box');
  if(!data||!data.length){box.innerHTML='<div class="sugg-searching">No results found. Try a different spelling or nearby city.</div>';return;}
  box.innerHTML=data.map(function(d){
    var addr=d.address||{};
    var city=addr.city||addr.town||addr.village||addr.hamlet||addr.suburb||d.display_name.split(',')[0];
    var state=addr.state||addr.county||'';
    var country=addr.country||'';
    var detail=[state,country].filter(Boolean).join(', ');
    var lat=parseFloat(d.lat).toFixed(4);
    var lng=parseFloat(d.lon).toFixed(4);
    return'<div class="sugg-item" onmousedown="pickCity(\''+city.replace(/'/g,"\\'")+'\',\''+detail.replace(/'/g,"\\'")+'\','+lat+','+lng+')">'+
      '<div class="sugg-city">'+city+'</div>'+
      '<div class="sugg-detail">'+detail+' &nbsp;·&nbsp; '+lat+'°, '+lng+'°</div></div>';
  }).join('');
  box.style.display='block';
}
function pickCity(city,detail,lat,lng){
  document.getElementById('pob_city').value=city+(detail?', '+detail:'');
  document.getElementById('pob_lat').value=lat;
  document.getElementById('pob_lng').value=lng;
  hideSugg();
  showGeoMsg('ok','✓ '+city+(detail?', '+detail:'')+' — Lat: '+lat+'°, Lng: '+lng+'°');
}
function hideSugg(){document.getElementById('sugg_box').style.display='none';}
function showGeoMsg(t,m){var el=document.getElementById('geo_msg');el.className='geo-msg '+t;el.textContent=m;}
function locateMe(){
  showGeoMsg('info','📍 Requesting GPS...');
  if(!navigator.geolocation){showGeoMsg('err','GPS not supported. Please type your city above.');return;}
  try{
    navigator.geolocation.getCurrentPosition(
      function(pos){
        var lat=pos.coords.latitude.toFixed(4);var lng=pos.coords.longitude.toFixed(4);
        document.getElementById('pob_lat').value=lat;document.getElementById('pob_lng').value=lng;
        fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lng+'&format=json',{headers:{'Accept-Language':'en'}})
        .then(function(r){return r.json();}).then(function(d){
          var a=d.address||{};var city=a.city||a.town||a.village||a.county||'Your Location';var country=a.country||'';
          document.getElementById('pob_city').value=city+(country?', '+country:'');
          showGeoMsg('ok','✓ '+city+(country?', '+country:'')+' — Lat: '+lat+'°, Lng: '+lng+'°');
        }).catch(function(){showGeoMsg('ok','✓ GPS detected — Lat: '+lat+'°, Lng: '+lng+'°');});
      },
      function(e){showGeoMsg('err',{1:'Permission denied. Please type city above.',2:'GPS unavailable. Please type city manually.',3:'GPS timed out.'}[e.code]||'Cannot detect location.');},
      {timeout:12000,maximumAge:300000,enableHighAccuracy:false}
    );
  }catch(e){showGeoMsg('err','GPS unavailable. Please type your city above.');}
}

1:{gem:'Ruby',day:'Sunday',color:'Red, Gold, Orange',metal:'Gold',stone:'Sun Stone',lucky:'1,10,19,28',un:'White, Silver, Black',desc:'You are ruled by Surya — the King. Control aggression to rise immensely. You like branded, quality things. Work 6am–6pm but energy drops after sunset.',deep:'Surya rules the 1st house. You will behave like an elder in the house irrespective of age. Govt job is a higher probability — you can become a director or CEO at a very early age. Sun in the 1st house means you will have heart disease or heartbreak. Take care of your stress and eyes. Finish dinner before sunset.',prof:'Government jobs, politics, authoritative roles, CEO, director, admin, team handling, client management, positions of power.',rem:'Stand in front of the rising Sun and pray. Respect elders. Donate gur. Wear Ruby or Sun Stone. Have a to-do list. Should not eat food after sunset. Wear gold. Put kesar, haldi, Chandan tikka always. Chant Surya Atharvashirsha or Aditya Hridaya Stotra every morning before 8am.',health:'Heart disease, stress, teeth problems, eye issues. Dinner should be completed before sunset.'},

3:{gem:'Yellow Sapphire / Yellow Citrine',day:'Thursday',color:'Yellow, Golden',metal:'Gold',stone:'Yellow Citrine',lucky:'3,12,21,30',un:'Blue, Black',desc:'You are ruled by Jupiter — Devta ke Guru. Accumulate knowledge over years. Your job is to heal and give knowledge. Enjoy good food but be careful — if you gain weight it will not stop.',deep:'Jupiter rules the 2nd house. Tells about your children, how much do you follow your religion, how well can you use and deliver your knowledge. They are highly skillful or knowledgeable in their field. Irrespective of the field they are in, they are interested in occult.',prof:'Healer, teacher, advisor, banker, lawyer, astrologer, good doctor (physician only). Teaching, coaching, counseling, spiritual healing.',rem:'Pray to Lord Vishnu. Wear Yellow Citrine. Face Northeast for work or pooja. Always wear GOLD. Wear tikka of haldi, kesar or Chandan every day. Thursday banana pooja.',health:'Obesity issues if food habits are not controlled. Liver and fat-related issues can arise.'},
4:{gem:'Hessonite (Gomed) / Tiger Eye',day:'Saturday',color:'Blue, Smoky, Dark',metal:'Iron/Lead',stone:'Tiger Eye',lucky:'4,13,22,31',un:'Red, Pink',desc:'You are ruled by Rahu — the most powerful planet. You can manipulate anyone. Highly energetic. To control Rahu: live in a cool place, avoid spicy food, drink water all day, write a daily to-do list.',deep:'Rahu rules the 4th house. Your health, how well socially will you be recognized, how much technical knowledge do you have, will there be accidents/injuries in life, secret enemies in life, how many legal cases will you have.',prof:'IT, digital marketing, technology, detective, radio, telephone, airport jobs, night shift, event management, research.',rem:'Wear Tiger Eye. Pray to Ganesh Bhagwan. Khatu Shyam ki pooja. Chant Hanuman Chalisa at least 5 times a day. Keep away from alcohol. Rahu Gayatri Mantra 108 times.',health:'Anxiety, depression, insomnia, accidents. Disciplined life and proper energy usage needed.'},
5:{gem:'Emerald / Green Aventurine',day:'Wednesday',color:'Green',metal:'Brass',stone:'Green Aventurine',lucky:'5,14,23',un:'Red, Black',desc:'You are ruled by Mercury — Buddh Dev. Number of balance. Mercury is like an 8-9 year old child — loves to play and enjoy. Mercury has no enemies.',deep:'Mercury rules the 9th house. Education, your skills, learning power, writing and communication power. Mercury in the 1st house supports business big time.',prof:'Journalism, writer, teacher, web designer, painting, book seller, accountant, astrologer. Business is a good field.',rem:'Pray to Lord Ganesha. Ganesh Chalisa, Ganesh Atharvashirsha. Wednesday offer Ladoo and Durvaas. Donate study material to kids. Feed birds with soaked sabut moong. Budh Gayatri Mantra jaap.',health:'Mercury is lazy — physical fitness needs attention. Blood or skin related diseases possible.'},
6:{gem:'Diamond / White Sapphire / Pyrite',day:'Friday',color:'White, Pink, Cream',metal:'Silver/Copper',stone:'Pyrite / Gold',lucky:'6,15,24',un:'Green, Brown',desc:'You are ruled by Venus (Shukr) — Kalyug ke Devta. It brings comfort and luxury. If a female is born with 6, she becomes Laxmi of the house.',deep:'Venus rules the 7th house. Your life partner, personal relationship, marital life, your profession, your enemies, female health issues, your respect, name, fame, prosperity.',prof:'All luxury items, beauty products, acting, fashion designing, architect or interior designer, modelling, tour and travel, musician, artist, gemstones, crystals, perfume, confectionery, bakery.',rem:'Friday do Laxmi Narayan pooja or kanya poojan. Pyrite, rose quartz — keep with yourself. Wear gold or silver. On Friday, make kheer or mithai, offer to Mata Rani. Chant Shukr Gayatri Mantra 108 times.',health:'Avoid laziness. Skin, eyes, and reproductive health issues possible.'},
7:{gem:"Cat's Eye",day:'Monday',color:'Violet, Ash, Grey',metal:'Silver/Mixed',stone:"Cat's Eye",lucky:'7,16,25',un:'Red, Orange',desc:"You are ruled by Ketu — a dependent planet with no head, thus directionless. There will be disappointment in life in at least 1 of the 4 aspects: personal, professional, health, or family. You are a pure soul.",deep:'Ketu rules the 8th house. Knowledge, creativity, foreign travel. Ketu always wants to help others. Ketu believes in people easily. Ketu has the power to create compatibility with anyone. They do not have enemies in numerology.',prof:'Must never stop learning. Zoologist, program developer, foreign language specialist, healer, alternate medicine, ayurveda, yoga, chakra healing, occult sciences, surgeon, detective.',rem:"Wear Cat's Eye. Offer flag to the left foot of Hanuman ji. Chant Hanuman Chalisa. Soak sabut moong on Tuesday night and feed to birds the next day. Go to temple daily. Ketu Gayatri Mantra 108 times.",health:'Health issues will always be there. One ailment will go, and another will come.'},
8:{gem:'Blue Sapphire / Amethyst',day:'Saturday',color:'Black, Dark Blue',metal:'Iron',stone:'Amethyst',lucky:'8,17,26',un:'White, Pink',desc:'You are ruled by Shani — Nyaya ke Devta (God of Justice). Slow and steady. Never multi-task. If you follow a routine, you will grow. Hard work is your mantra.',deep:'Saturn rules the 3rd house. Your professional life, will you be good in business, how well will you perform in your workplace, how many enemies will you have, will you have any diseases.',prof:'Agriculture, construction, mining, shoe making, stonework, wood-related work. Lawyer, judge, police. Contractor work.',rem:'Pray to Bhagwan Hanuman ji or Bhairav ji. Keep amethyst with you. Do not walk barefoot in home. Give water to Peepal or Neem tree before sunrise. Donate slippers and blankets. Wear gold. Hanuman Chalisa 5 times a day. Shani Gayatri Mantra 108 times.',health:'Bone related problems, cervical issues. Keep physically active always. You should always sweat.'},
9:{gem:'Red Coral / Mauli',day:'Tuesday',color:'Red',metal:'Copper',stone:'Red Coral',lucky:'9,18,27',un:'Green, Blue',desc:'You are ruled by Mangal (Mars) — Dharti Putra. You have immense energy and anger. Control your anger. Every 2-5 years of uncontrolled anger you will see struggle.',deep:'Mars rules the 5th house. Your energy, courage, will power, health, accident, property issues. If you are disciplined and calculated, the results will be in your favor. With 9, you are courageous and if you are disciplined, you will do wonders.',prof:'Security, army, military, private security, police. Professional sports. Engineering, fire-related jobs. Sale/purchase of land. Good surgeon. Dentist.',rem:'Your lord is Hanumanji. Pray to Hanuman ji and Lord Ram. Keep South direction clean. Keep Shivling in house or go to temple daily. Put saffron tikka on forehead everyday. On Tuesday donate chane ki dal in mandir. Chant Mangal Gayatri Mantra 108 times.',health:'Blood related issues, blood pressure, reproductive organ diseases. High risk of accidents.'}

// ── VEDIC ASTRO ENGINE ────────────────────────────────────────────────────────
function normDeg(d){return((d%360)+360)%360;}
function julianDay(yr,mo,dy,hr){var Y=yr,M=mo,D=dy+hr/24;if(M<=2){Y--;M+=12;}var A=Math.floor(Y/100);var B=2-A+Math.floor(A/4);return Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+D+B-1524.5;}
function toRad(d){return d*Math.PI/180;}
function toDeg(r){return r*180/Math.PI;}

function calcPlanets(yr,mo,dy,bhr,bmn,lat,lng){
  var jd=julianDay(yr,mo,dy,bhr+bmn/60-lng/15); // convert to UT
  var T=(jd-2451545.0)/36525.0;
  // Lahiri Ayanamsa
  var ayanamsa=23.85+0.01360836*(jd-2451545)/365.25;
  // Sun
  var sunL=normDeg(280.46646+36000.76983*T);
  var sunM=normDeg(357.52911+35999.05029*T);var sunMr=toRad(sunM);
  var sunEq=1.914602*Math.sin(sunMr)+0.019993*Math.sin(2*sunMr)+0.000289*Math.sin(3*sunMr);
  var sunSid=normDeg(sunL+sunEq-ayanamsa);
  // Moon
  var moonL=normDeg(218.3165+481267.8813*T);
  var moonM=normDeg(134.9634+477198.8676*T);var moonMr=toRad(moonM);
  var moonD=normDeg(297.8502+445267.1115*T);var moonDr=toRad(moonD);
  var moonF=normDeg(93.2721+483202.0175*T);var moonFr=toRad(moonF);
  var moonEq=6.2886*Math.sin(moonMr)+1.2740*Math.sin(2*moonDr-moonMr)+0.6583*Math.sin(2*moonDr)+0.2136*Math.sin(2*moonMr)-0.1851*Math.sin(toRad(normDeg(357.5291+35999.0503*T)))-0.1143*Math.sin(2*moonFr)+0.0588*Math.sin(2*moonDr-2*moonMr)+0.0572*Math.sin(2*moonDr+moonMr-2*moonFr);
  var moonSid=normDeg(moonL+moonEq-ayanamsa);
  // Mercury (simplified orbital)
  var merL=normDeg(252.2509+149472.6674*T);var merM=normDeg(174.7948+53892.0298*T);var merMr=toRad(merM);
  var merSid=normDeg(merL+0.3167*Math.sin(merMr)-ayanamsa);
  // Venus
  var venL=normDeg(181.9798+58517.8156*T);var venM=normDeg(212.9618+58517.8039*T);var venMr=toRad(venM);
  var venSid=normDeg(venL+0.7758*Math.sin(venMr)-ayanamsa);
  // Mars
  var marL=normDeg(355.4330+19140.2993*T);var marM=normDeg(19.3730+19140.2993*T);var marMr=toRad(marM);
  var marSid=normDeg(marL+10.6912*Math.sin(marMr)-ayanamsa);
  // Jupiter
  var jupL=normDeg(34.3515+3034.9057*T);var jupM=normDeg(20.9202+3034.9057*T);var jupMr=toRad(jupM);
  var jupSid=normDeg(jupL+5.5549*Math.sin(jupMr)-ayanamsa);
  // Saturn
  var satL=normDeg(50.0774+1222.1138*T);var satM=normDeg(317.0207+1222.1138*T);var satMr=toRad(satM);
  var satSid=normDeg(satL+6.3585*Math.sin(satMr)-ayanamsa);
  // Rahu (mean lunar node)
  var rahuSid=normDeg(125.0445-1934.1363*T-ayanamsa);
  var ketuSid=normDeg(rahuSid+180);
  // Ascendant using RAMC
  var RAMC=normDeg(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T+lng);
  var e=23.4392911111-(0.013004167+0.0000001639*T)*T;
  var latRad=toRad(lat);var ramcRad=toRad(RAMC);var eRad=toRad(e);
  var ascTan=Math.cos(ramcRad)/(-Math.sin(ramcRad)*Math.cos(eRad)-Math.tan(latRad)*Math.sin(eRad));
  var ascTropic=normDeg(toDeg(Math.atan(ascTan))+(Math.cos(ramcRad)<0?180:0));
  var ascSid=normDeg(ascTropic-ayanamsa);
  return{Sun:sunSid,Moon:moonSid,Mercury:merSid,Venus:venSid,Mars:marSid,Jupiter:jupSid,Saturn:satSid,Rahu:rahuSid,Ketu:ketuSid,Ascendant:ascSid};
}

function getSign(deg){return Math.floor(normDeg(deg)/30);}
function getDegInSign(deg){return normDeg(deg)%30;}
function getHouseNum(planetDeg,ascDeg){return((Math.floor(normDeg(planetDeg-ascDeg)/30))+12)%12+1;}

// ── NORTH INDIAN VEDIC CHART (proper diamond/square layout) ─────────────────
// Standard North Indian chart: 4x4 grid, center 4 cells empty
// Houses in fixed positions (house NUMBER at fixed cell), signs rotate with lagna
// Cell layout (row,col): 
//  (0,0)=H12  (0,1)=H1  (0,2)=H2  (0,3)=H3
//  (1,0)=H11  center    center    (1,3)=H4
//  (2,0)=H10  center    center    (2,3)=H5
//  (3,0)=H9   (3,1)=H8  (3,2)=H7  (3,3)=H6
// BUT signs in each house depend on Lagna: Lagna sign goes in H1, next sign in H2, etc.

function renderNIChart(planets,ascSign,houseMap){
  var S=70; // cell size in px
  var W=S*4,H=S*4;
  // House layout: fixed house numbers at fixed grid positions
  var houseGrid=[
    [12,1,2,3],
    [11,-1,-1,4],
    [10,-1,-1,5],
    [9,8,7,6]
  ];
  var html='<svg width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg" style="font-family:var(--font-sans)">';
  // Draw outer border
  html+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="none" stroke="var(--color-border-secondary)" stroke-width="1"/>';
  // Draw inner cross lines
  html+='<line x1="'+S+'" y1="0" x2="'+S+'" y2="'+H+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';
  html+='<line x1="'+(2*S)+'" y1="0" x2="'+(2*S)+'" y2="'+H+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';
  html+='<line x1="'+(3*S)+'" y1="0" x2="'+(3*S)+'" y2="'+H+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';
  html+='<line x1="0" y1="'+S+'" x2="'+W+'" y2="'+S+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';
  html+='<line x1="0" y1="'+(2*S)+'" x2="'+W+'" y2="'+(2*S)+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';
  html+='<line x1="0" y1="'+(3*S)+'" x2="'+W+'" y2="'+(3*S)+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';
  // Draw diagonal lines in center cells
  html+='<line x1="'+S+'" y1="'+S+'" x2="'+(3*S)+'" y2="'+(3*S)+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';
  html+='<line x1="'+(3*S)+'" y1="'+S+'" x2="'+S+'" y2="'+(3*S)+'" stroke="var(--color-border-secondary)" stroke-width="0.5"/>';

  // Fill each cell
  for(var r=0;r<4;r++){
    for(var c=0;c<4;c++){
      var houseNum=houseGrid[r][c];
      if(houseNum<0)continue; // center cell
      var x=c*S,y=r*S;
      // Is lagna?
      var isLagna=(houseNum===1);
      if(isLagna){html+='<rect x="'+x+'" y="'+y+'" width="'+S+'" height="'+S+'" fill="rgba(83,74,183,0.08)"/>';}
      // Sign in this house (ascSign = sign in H1, ascSign+1 in H2, etc.)
      var signIdx=(ascSign+houseNum-1)%12;
      var signName=SIGNS_HI[signIdx]; // Hindi sign name
      // House number
      html+='<text x="'+(x+3)+'" y="'+(y+11)+'" font-size="8" fill="var(--color-text-secondary)" font-weight="600">'+houseNum+'</text>';
      // Sign name
      html+='<text x="'+(x+S/2)+'" y="'+(y+22)+'" font-size="8" fill="#534AB7" text-anchor="middle">'+signName+'</text>';
      // Planets in this house
      var planetsInHouse=houseMap[houseNum]||[];
      var py2=y+36;
      planetsInHouse.forEach(function(p,pi){
        var col=PLANET_COLOR[p]||'#333';
        var abbr=PLANET_ABB[p]||p.substring(0,2);
        // Add degree info
        var deg=planets[p];var degInSign=getDegInSign(deg).toFixed(0);
        html+='<text x="'+(x+S/2)+'" y="'+(py2+pi*12)+'" font-size="9" fill="'+col+'" text-anchor="middle" font-weight="700">'+abbr+' '+degInSign+'°</text>';
      });
    }
  }
  // Center: chart title
  html+='<text x="'+W/2+'" y="'+(H/2-6)+'" font-size="10" fill="var(--color-text-secondary)" text-anchor="middle">Vedic</text>';
  html+='<text x="'+W/2+'" y="'+(H/2+8)+'" font-size="10" fill="var(--color-text-secondary)" text-anchor="middle">Birth Chart</text>';
  html+='</svg>';
  return html;
}

function getLH(hr,mn,wday){var row=Math.floor(hr)%12;var col=wday*2+(hr<12?0:1);return LHORA[row][col];}
function getMDseq(dr){var seq=[];for(var i=0;i<9;i++){var p=((dr-1+i)%9)+1;seq.push({p:p,y:MDY[i]});}return seq;}
function getActiveMD(dr,birthYr,curYr){var seq=getMDseq(dr);var y=birthYr;var c=0;while(c<10){for(var i=0;i<seq.length;i++){var s=seq[i];if(curYr>=y&&curYr<y+s.y)return{p:s.p,y:s.y,sy:y,ey:y+s.y};y+=s.y;}c++;}return null;}
function getADs(md){var seq=getMDseq(md.p);var ads=[];var cur=md.sy;for(var i=0;i<seq.length;i++){var s=seq[i];var m=(md.y*s.y)/45*12;ads.push({p:s.p,months:m,sy:cur,ey:cur+m/12});cur+=m/12;}return ads;}
function prel(p1,p2){if((FRND[p1]||[]).indexOf(p2)>=0)return'f';if((NFRND[p1]||[]).indexOf(p2)>=0)return'uf';return'n';}
function rl(r){return r==='f'?'Friendly':r==='uf'?'Non-friendly':'Neutral'}
function rc(r){return r==='f'?'tf':r==='uf'?'tu':'tn'}
