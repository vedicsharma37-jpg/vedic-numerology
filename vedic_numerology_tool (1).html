  1:'Ketu in Sun house — Ketu is most in-problem planet. Problems never disappear. Always want to help others. Believe in people easily. Can create compatibility with anyone. No enemies in numerology. Best power: spirituality, calm behavior, tolerance. Want everything in life. Can be exceptional in argumentation. Sharp mind. Must work on weight gain. Universe support always there. Not good support from children. Spouse will be supportive.',
  2:'Saturn in Jupiter house — amazing teachers. Knowledge cannot be challenged. Challenge themselves constantly to improve. Can be great scientists, strategy planners. Strong money and finance management. Kanjoos — cannot make them spend money. Do not conflict with govt or govt personnel.',
  3:'Mars in Saturn house — Ketu ascendant. Shani and Mangal neutral but makes highly courageous. Restless. Will follow discipline with dedication for success. Since Ketu is ascendant — do not blindly follow anyone, will be betrayed. Keep confidence level high, be focused and determined. Born in lower-middle class but can reach higher class.',
  4:'Sun in Rahu house — Grahan Dosh. Never do anything wrong in life. No illegal work. Do not argue with govt officials. No tax fraud. Never share plans or loopholes. Sun in 4th house means will have to take medicines for a disease. Ketu ascendant means one ailment ends, another comes. Work on food, exercise and health. Take care during eclipses. Sun and Rahu together make you overconfident. Highly intelligent, business oriented. Have faith on spouse.',
  5:'Moon in Mars house — Panchda neutral. Highly humanitarian and intelligent. Comparatively a good life. Be more spiritual. Very moody. No hobbies. Follow fixed ideology. Can be very good teachers, writers, extremely good occult practitioner. Drawn towards occult science. Good intuitive powers since Ketu is ascendant. Luck changes after marriage.',
  6:'Jupiter in Moon house — Jupiter and Chandrma have good relationship. Fantastic reputation — know how to get name fame. Long life. Do really well in education field. Scholars. Personality and character are very good. Give positive energy regardless of others\' negativity. As they grow older, occult knowledge becomes exponential. Name fame prosperity keeps increasing and never reduces.',
  7:'Rahu in Venus house — friends. Ketu ascendant. Since Rahu is in Venus house, have limitless power which makes you overconfident. More chances of failure. If Ketu is religious, spiritual and dedicated, Rahu will not have a lot of impact and will support positively. Not good relationship with siblings especially in early childhood. Will want love marriage, possibly inter-caste.',
  8:'Mercury in Ketu house — Ketu ascendant. Both are neutral. Mercury and Ketu are students, both can go towards spirituality. More they hone skills, the more they gain. Courageous individuals with love for art and lively nature. Strong potential for occult practices. Prefer to solve people\'s problems and social work. Should never share secrets with anyone. Meditate.',
  9:'Venus in Mercury house — friends. Very strong communication, soft spoken, thoughtful, beautiful ideas. Cannot sit at one place. Foreign travel and occult science comes easy. Better networking means more growth. Support from spouse is important. Keep peace with opposite gender including spouse to find success in life.'
},
8:{
  1:'Saturn in Sun house — enemies but father-son relationship. Imaginative power strong. Must follow discipline for success. Egoistic — small things hurt. Unstable mind. Can create problems in any relationship. Father and son should not live under one roof after starting work. Never hurry to make a house — buy or build only after 35-40 years.',
  2:'Mars in Jupiter house — very good combination. Money flows. Person will be religious. Mars with Jupiter makes them fearless. Leaders who do not fear anything. Saturn ascendant brings struggles in 20s but in 30s steady growth begins. Will get family property. Lazy at home but highly active once outside the house.',
  3:'Sun in Saturn house — enemies — Sthan Parivartan. Mentally very strong, highly intelligent, want to dominate with goodness in heart. Always face obstacles in education and smooth life. Karm Pradhan — do not believe in God, believe in themselves. Start earning at very early age. Will get only one thing — money or relationships. Highly practical, do not trust easily.',

  6:'Rahu in Moon house — enemies. Saturn ascendant. Not a good combination. Health issues. Relationship with father not good. Mother\'s health not good. Mother will always have more expectations. Take bath with gangajal every day. If not, on Amavasya and Poornima take gangajal bath. Work hard and stay disciplined. Learn more languages for growth.',
  7:'Mercury in Venus house — Mercury and Shukr are really good friends. Only good combination in this grid. Can be highly attractive. Attracted towards fine arts, culture, drama. Get a lot of help from opposite gender. Marry into higher class but have problems in marital life. Work on writing skills — very important. Do not gamble or work in stocks.',
  8:'Venus in Ketu house — Saturn ascendant. Venus in Ketu house is considered a good combination but makes it highly dominating. Never share secrets — will become public. Blame game, reputation tarnished. Highly selfish, highly arrogant. Rude communication. Only see their benefit. Lust is an easy vice. Marital life can be destroyed. Very painful old age.',
  9:'Ketu in Mercury house — Saturn ascendant. Mercury and Ketu are neutral — both students. Education field — very good. Highly intelligent. Art lover. Easily attracted to occult sciences. Paranormal and tantra also attract them. Guru support must be there. Continue to work hard and improve skills for immense growth.'
},
9:{
  1:'Mars in Sun house — both have high energy. Will not bow in front of anyone when right. Will get angry on small things. Disciplined and calculated results will be in favor. Courageous — with discipline will do wonders. Will always be associated with security, doctor, engineer, or lawyer fields. Possible diseases in reproductive organs. Avoid spicy food, RED CHILLIES, street food, nonveg, alcohol. Mangal Bhagwan is dharti putr — be inclined towards nature.',
  2:'Sun in Jupiter house — in panchda, Sun and Jupiter are friends. Good combination. Growth if honest with people and work. Improve skills to become master in field. Good communication skills and convincing power. God fearing. Possibly long life. Will get parental property. Confident, strong will power, do not like asking for help. Can be a doctor, engineer, lawyer, judge, teacher.',
  3:'Moon in Saturn house — Shani and Chandrma neutral to each other. With little effort Chandrma gets good growth. Highly intelligent, self-made people, courageous. Strong in professional life and successful. May have multiple sources of income. Good company is key to success. Do not be irresponsible. Do not use dairy products at night. Pray to Lord Shiva — even just jal to shivling reduces struggles.',
  4:'Jupiter in Rahu house — Guru Chandaal Dosh. Become very courageous. Keep relationship with in-laws limited — more involvement, less success. This person will have to work really hard and be very patient. With ascendant 9 and Jupiter in 4th house, makes them highly courageous to a fault. Can easily judge who to use when and how. Strong psychic power.',
  5:'Rahu in Mars house — very courageous. Extremely positive or extremely negative relationship with opposite gender. Well versed in many languages. Self-made people. Can have a little high body temperature. Be careful when driving. Overconfidence is biggest problem. Language is the enemy. Lazy people who like to keep home beautiful. Addiction to luxury items.',
  6:'Mercury in Moon house — Mercury considers Moon as enemy, Moon doesn\'t. Mars ascendant. Spendthrift. Intelligent. A lot of property since ascendant is 9. Love their cars. Strategy making and planning — really good with it. Big social status and friend circle. Business growth there. Relationship issues with mother or communication gap.',
  7:'Venus in own house — ascendant Mars. Jovial, like to keep good relationships. Highly intelligent. Can be good writer or poet. Sharp minded. Success dependent on spouse — the happier the spouse, the better the life. Success seen after marriage. Age will be more than spouse. Short tempered. Life will be 360 degrees from father\'s life.',
  8:'Ketu in own house — Mars ascendant. Can be lazy. Courageous and ambitious. If given a task, will work hard to complete it. Helpful. Foreign travel. Will be highly stubborn. Will not think before criticizing someone. Maintain cordial relationships. Avoid blame game.',
  9:'Saturn in Mercury house — Mars ascendant. Highly intelligent. High risk taking capacity. Very respectful and fast learner. Can complete any given task efficiently. Cannot keep good relationship with neighbors and relatives. Do not go towards sudden gain and investments. Keep relationship with kids cordial. More they help society, more name fame and prosperity.'

7:{

var GOCHAR_DESC={1:'Gochar year 1 gives you name and fame. Growth in business. Job promotion. Good for new beginnings and startups. Surya year — high energy but can have anger issues due to others\' behavior.',2:'Gochar year 2 is not considered good. Can make you flickering minded. Health issues — if mother lives with you, her health will also be affected. Financial growth may happen but expenses increase too. No savings. Must keep well-wishers around for support.',3:'Gochar year 3 is considered good. Auspicious events possible in house. Business expansion. Marriage is supported. Plan a baby. Increase spirituality. If planets support, learning occult modality becomes very easy.',4:'Gochar year 4 is not considered good. Will play on your mind — anxiety and depression are common. If married, marital life will be affected. If grid has multiple 2 or 4, it turns more negative — can give suicidal tendencies. Disciplined life and proper energy usage needed.',5:'Gochar year 5 is considered good. Success in education or competitive exams. Develop your skills. Business expansion. Good for networking and marriage. If it is a love marriage, it will succeed. Mercury cannot tolerate pressure — can push towards divorce or split if in such a relationship.',6:'Gochar year 6 is excellent. Supports family and relationships. Support from spouse. Plan a vacation. Romance and personal life are great. Will spend on branded clothes, shoes, perfumes. Can buy new vehicle or house. Buying is supported. Business in partnership also works. Avoid wrong addictions.',7:'Gochar year 7 helps in spirituality and education. Export-import business supported. Foreign travel or transfer to another city is possible. A new job is also supported. Ketu does not support relationships — keep communication channels open with spouse.',8:'Gochar year 8 is not a good Gochar year. Keeps you mentally disturbed with high stress. Take on a lot of unwanted responsibilities. Can become workaholic. Good chances of getting parental property. If there is a court case and you have done nothing wrong — results will be in your favor.',9:'Gochar year 9 is considered very good. Success in projects and job. High chance of success in competitive exams. Can acquire property. Start a new venture. Attraction towards opposite gender. If planets don\'t support — possible operation. Avoid taking loan.'};

var PY_DESC={1:'Personal year 1 — Sun comes as a friend and will support you in any form. New beginnings are on the horizon with growth in personal, health, business, and professional life. You will grow in relationships too. Energy is very high. Comes after years 7, 8, 9 of struggle — now great opportunities. Support comes from practically everyone.',2:'Personal year 2 — Chandrma is activated. You will have ups and downs. Do not do anything new this year — continue whatever you started in year 1. Think twice before making any decisions — no hasty decisions. Mood swings can make you feel bad about anything said to you. Avoid arguments. Put extra effort into personal relationships.',3:'Personal year 3 — for education, networking, and spiritual journey. Should follow your religion. Best year to take and get knowledge. Cannot be money-minded this year. Business grows and career is supported.',4:'Personal year 4 — Rahu is activated. Creates Bhram and does not bring stability. Life has ups and downs. Can easily get into an argument. Can make you lazy. With a to-do list, Rahu can give you unexpected growth. If you work hard, it will be the best time of your life.',5:'Personal year 5 — Mercury brings balance in your life. A very good year. Can get growth and get stuck work done. Support from family. This year brings change, growth, new development. Supports for job, business, and even marriage. Foreign travel possible. Makes you lazy though.',6:'Personal year 6 — very good personal year. Brings luxury and comfort. Shukr is Kalyug ke Devta. Name fame attraction — everything comes. If you respect the opposite gender — Shukr is active. If not — reputation suffers.',7:'Personal year 7 — Ketu, Shani, and Mangal are there to keep a check on you. Will be judged at every level. Meditate — it helps store your energy. Work on your skills. Do spiritual journeys. Avoid financial decisions.',8:'Personal year 8 — Shani is activated. Hard work is the only way. Will face blockages and delays but discipline and patience bring results. Keep moving — leave the house every day.',9:'Personal year 9 — Mangal is here. Very good year for completing projects. Success in job and competitive exams. Can acquire property. Start new ventures. Avoid conflicts. Avoid taking loans.'};

var LAXMI_DESC={1:'Laxmi Ank 1 — gives administrative power. You can handle people and situations. You have control power so you can never have irritation or aggression.',2:'Laxmi Ank 2 — your intuition power is your best power. You must be polite and help people. Use of intuition power is a must and it will help you progress.',3:'Laxmi Ank 3 — the more you connect with people and solve their problems, the more you will grow. Occult healing is your destiny.',4:'Laxmi Ank 4 — Rahu should follow discipline. Be organized, create a timetable, follow a routine — then Laxmi supports.',5:'Laxmi Ank 5 — very nice. Network and communication are the key to success.',6:'Laxmi Ank 6 — communication and networking should be strong. Make people yours, keep people happy. Keep colleagues and opposite gender happy — growth will happen.',7:'Laxmi Ank 7 — whatever field you go into, have deep knowledge. Just keep developing your skills. Occult is good for you, but you must be a master.',8:'Laxmi Ank 8 — Shani is hard work. You must earn your own money. Till the time you are moving around you will keep earning. Leave the house every day for at least an hour.',9:'Laxmi Ank 9 — has energy. You should help people below you. Humanitarian. The more you use cleverness (not cunningness), the Laxmi Ank will support you. No aggression and no anger.'};

function ds(n){var s=0;String(Math.abs(n)).split('').forEach(function(d){s+=parseInt(d)});if(s>9)return ds(s);return s}

function getLaxmiHora(hr,mn,wday){
  var row=Math.floor((hr*60+mn)/60)%12;
  var isAM=(hr<12);
  var col=wday*2+(isAM?0:1);
  return LHORA[row][col];
}

function getNavamsha(hr,mn,horaAsc){
  var minInHour=(hr*60+mn)%60;
  var section=Math.floor(minInHour/6.6667);
  if(section>8)section=8;
  // Find column for horaAsc
  var colMap={1:0,4:0,2:1,7:1,9:2,5:3,3:4,6:5,8:6};
  var col=colMap[horaAsc]||0;
  return NAVM_TABLE[section][col];
}

function getGochar(dob,birthYr,curYr){
  var parts=dob.split('-');
  var dy=parseInt(parts[2]);
  var driver=ds(dy);
  var diff=curYr-birthYr;
  var rem=diff%9;
  var gocharNum=((driver-1+rem)%9)+1;
  return gocharNum;
}

function getPY(dy,mo,curYr){return ds(dy+mo+curYr)}
function getStrength(dy,mo){return ds(dy+mo)}

function getMDseq(driver){
  var seq=[];
  for(var i=0;i<9;i++){var p=((driver-1+i)%9)+1;seq.push({p:p,y:MDY[i]});}
  return seq;
}
function getActiveMD(driver,birthYr,curYr){
  var seq=getMDseq(driver);
  var y=birthYr;
  var cycles=0;
  while(cycles<10){
    for(var i=0;i<seq.length;i++){
      var s=seq[i];
      if(curYr>=y&&curYr<y+s.y)return{p:s.p,y:s.y,sy:y,ey:y+s.y};
      y+=s.y;
    }
    cycles++;
  }
  return null;
}
function getADs(md){
  var seq=getMDseq(md.p);
  var ads=[];
  var cur=md.sy;
  for(var i=0;i<seq.length;i++){
    var s=seq[i];
    var months=(md.y*s.y)/45*12;
    ads.push({p:s.p,months:months,sy:cur,ey:cur+months/12});
    cur+=months/12;
  }
  return ads;
}
function prel(p1,p2){
  if((FRIENDS[p1]||[]).indexOf(p2)>=0)return'f';
  if((NONFRIENDS[p1]||[]).indexOf(p2)>=0)return'uf';
  return'n';
}
function rl(r){return r==='f'?'Friendly':r==='uf'?'Non-friendly':'Neutral'}
function rc(r){return r==='f'?'tf':r==='uf'?'tu':'tn'}

function getYinYang(digits){
  var YY={1:{yin:0,yang:2},2:{yin:2,yang:0},3:{yin:0,yang:0},4:{yin:1,yang:0},5:{yin:0,yang:0},6:{yin:0,yang:0},7:{yin:0,yang:2},8:{yin:1,yang:0},9:{yin:0,yang:2}};
  var totalYin=0,totalYang=0;
  digits.forEach(function(d){if(d>0&&YY[d]){totalYin+=YY[d].yin;totalYang+=YY[d].yang;}});
  return{yin:totalYin,yang:totalYang,dominant:totalYang>totalYin?'Yang (Male)':totalYin>totalYang?'Yin (Female)':'Balanced (Shiv-Shakti)'};
}

function renderGridAnalysis(yogs, conj, allD, miss, cnt, dr) {
  // Group yogs by category
  var cats = ['Main Yog','Conjunction','Opposite Aspect','Retro Aspect','Trine Aspect','Angular Aspect'];
  var catColors = {'Main Yog':'#534AB7','Conjunction':'#2E7D32','Opposite Aspect':'#B71C1C','Retro Aspect':'#E65100','Trine Aspect':'#0D47A1','Angular Aspect':'#6A1B9A'};
  var catBg = {'Main Yog':'#EEE8FF','Conjunction':'#E6F4EA','Opposite Aspect':'#FFEBEE','Retro Aspect':'#FFF3E0','Trine Aspect':'#E3F2FD','Angular Aspect':'#F3E5F5'};

  var yogSections = '';
  cats.forEach(function(cat) {
    var catYogs = yogs.filter(function(y){return y.cat===cat});
    if(catYogs.length === 0) return;
    yogSections += '<div style="margin-bottom:.75rem"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:'+catColors[cat]+';margin-bottom:.4rem;padding:3px 8px;background:'+catBg[cat]+';border-radius:5px;display:inline-block">'+cat+' ('+catYogs.length+')</div>';
    catYogs.forEach(function(y){
      var cls=y.type==='p'?'yp':y.type==='n'?'yn':'yne';
      yogSections += '<div style="margin-bottom:.6rem;padding:.6rem .75rem;background:#F9F8FF;border-radius:8px;border-left:3px solid '+(y.type==='p'?'#2E7D32':y.type==='n'?'#B71C1C':'#F57F17')+'">'+
        '<span class="yt '+cls+'" style="margin-bottom:3px;display:inline-block">'+y.name+'</span>'+
        '<div style="font-size:12px;color:#333;line-height:1.6;margin-top:3px">'+y.desc+'</div>'+
        (y.rem?'<div style="font-size:11px;color:#534AB7;margin-top:4px;font-weight:500">Remedy: '+y.rem+'</div>':'')+
        '</div>';
    });
    yogSections += '</div>';
  });

  if(!yogSections) yogSections = '<div class="db">No Yogs, Conjunctions or Aspect Yogs detected in this grid.</div>';

  var repH='';
  Object.keys(cnt).forEach(function(n){
    if(cnt[n]>=2){
      var nd=parseInt(n);var tk=cnt[n]>=4?'4':String(cnt[n]);
      var desc=(REP_DESC[nd]&&REP_DESC[nd][tk])||'Number '+n+' appears '+cnt[n]+' times.';
      repH+='<div class="ri"><strong>'+Array(cnt[n]+1).join(String(n))+' ('+PL[n]+' × '+cnt[n]+'):</strong> '+desc+'</div>';
    }
  });

  var missH=miss.length?miss.map(function(n){return'<div class="ri"><strong>'+n+' — '+PL[n]+':</strong> '+MISSING_REM[n]+'</div>'}).join(''):'<div class="db" style="color:#1B5E20">All numbers 1–9 are present. Your grid is complete — a rare and auspicious sign.</div>';

  var totalYogs = yogs.length;
  var posYogs = yogs.filter(function(y){return y.type==='p'}).length;
  var negYogs = yogs.filter(function(y){return y.type==='n'}).length;

  document.getElementById('t3').innerHTML=
  '<div class="card"><h2>Vedic Grid Analysis — All Yogs, Conjunctions & Aspect Yogs</h2>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.75rem">'+
  '<div class="li" style="min-width:80px"><div class="k">Total Yogs Found</div><div class="v" style="font-size:18px;color:#534AB7">'+totalYogs+'</div></div>'+
  '<div class="li" style="min-width:80px"><div class="k">Positive</div><div class="v" style="font-size:18px;color:#1B5E20">'+posYogs+'</div></div>'+
  '<div class="li" style="min-width:80px"><div class="k">Negative/Dosh</div><div class="v" style="font-size:18px;color:#B71C1C">'+negYogs+'</div></div>'+
  '</div>'+
  yogSections+'</div>'+
  (repH?'<div class="card"><h2>Repetitive Numbers (Amplified Energy)</h2>'+repH+'</div>':'')+
  '<div class="card"><h2>Missing Number Remedies</h2>'+missH+'</div>'+
  '<div class="card"><h2>Best Professions from Grid — Driver '+dr+'</h2><div class="db">'+PROFESSION[dr]+'</div></div>';
}

  compatH+='</tbody></table></div>';
  document.getElementById('t4').innerHTML=
  '<div class="card"><h2>Mahadasha Sequence — Driver '+dr+' ('+PL[dr]+') | ★ = active</h2><div style="overflow-x:auto"><table><thead><tr><th>Planet</th><th>#</th><th>Duration</th><th>Start</th><th>End</th></tr></thead><tbody>'+mdRows+'</tbody></table></div></div>'+
  '<div class="card"><h2>Active Mahadasha — Antardasha Breakdown | ★ = current period</h2>'+adH+'</div>'+
  '<div class="card"><h2>Mahadasha / Antardasha Compatibility Table</h2>'+compatH+'</div>';
}

function renderAstro(lxAnk,nav,annHora,bhr,bmn,wday,curWday,sunData,dr,co,mo,dy,yr){
  var horaLabel=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  
  // Laxmi ank description
  var lxDesc=LAXMI_DESC[lxAnk];
  
  // Navamsha description
  var navDesc=mode===2?NAVM_DESC[nav]:'Enable Astro Numerology mode with birth time to calculate Navamsha.';
  
  // Annual hora transit
  var annHoraData=HORA_TRANSITS[annHora]||{title:'Transit Year',desc:'This annual hora transit analysis is based on the day of week your birthday falls on in the current year.',remedies:'Follow general remedies for your ascendant number.'};
  
  // Ascendant house analysis - laxmiAnk is the ascendant
  var ascHouses=ASC_HOUSE[lxAnk];
  // Determine which house position from grid
  var GRID_POS_MAP={1:1,9:2,3:3,7:7,5:5,8:8,2:6,4:4,6:6};
  
  // Sun sign
  var sunSign=sunData.sign;
  var sunDesc=sunData.desc;
  
  // House descriptions for current ascendant
  var houseDescs=ASC_HOUSE[lxAnk]||{};
  
  var allHouseKeys=Object.keys(houseDescs);
  var houseH='<div style="display:grid;grid-template-columns:1fr;gap:.5rem">';
  var HOUSE_NAMES=['1st House (Sun) — Success, leaders, physical strength','2nd House (Jupiter) — Children, religion, knowledge, foreign travel','3rd House (Saturn) — Professional life, business, enemies, debt','4th House (Rahu) — Health, social recognition, technical knowledge','5th House (Mars) — Energy, courage, will power, health, property','6th House (Moon) — Thought process, relationship with mother, satisfaction','7th House (Venus) — Life partner, personal relationship, name fame, prosperity','8th House (Ketu) — Knowledge, creativity, foreign travel, marital life','9th House (Mercury) — Education, skills, writing, communication, marital life'];
  allHouseKeys.forEach(function(k){
    var houseIdx=parseInt(k)-1;
    houseH+='<div class="transit-house"><div class="ht">'+HOUSE_NAMES[houseIdx]+'</div><div>'+houseDescs[k]+'</div></div>';
  });
  houseH+='</div>';
  
  // Ascendant remedies
  var ascRem=ASC_REMEDIES[lxAnk]||'No specific ascendant remedies found.';
  
  document.getElementById('t5').innerHTML=
  '<div class="card"><h2>Laxmi Ank / Hora Ascendant: '+lxAnk+' ('+PL[lxAnk]+')</h2>'+
  '<div style="font-size:11px;color:#6b6b8a;margin-bottom:.5rem">Born: '+horaLabel[wday]+', '+bhr+':'+String(bmn).padStart(2,'0')+' → '+('AM/PM'.split('/')[bhr<12?0:1])+' Hora</div>'+
  '<div class="db">'+lxDesc+'</div></div>'+
  (mode===2?
  '<div class="navamsha-box"><h3>Navamsha D9: '+nav+' ('+PL[nav]+')</h3><div style="font-size:12px;color:#444;margin-top:.4rem">'+navDesc+'</div></div>':
  '<div class="db" style="border-left-color:#FFB74D">Enable <strong>Astro Numerology mode</strong> with your birth time to unlock Navamsha D9 reading.</div>')+
  '<div class="card"><h2>Sun Sign: '+sunSign.n+'</h2>'+
  '<div class="lg2" style="margin-bottom:.75rem">'+
  '<div class="li"><div class="k">Ruling Planet</div><div class="v">'+PLN[sunSign.lord]+'</div></div>'+
  '<div class="li"><div class="k">Exalted Planet</div><div class="v">'+(sunSign.ex?PLN[sunSign.ex]:'None')+'</div></div>'+
  '<div class="li"><div class="k">Debilitated Planet</div><div class="v">'+(sunSign.db?PLN[sunSign.db]:'None')+'</div></div>'+
  '</div>'+
  '<div class="db">'+sunDesc+'</div></div>'+
  '<div class="hora-box"><h3>Annual Hora Transit '+new Date().getFullYear()+': Ascendant '+annHora+' ('+PL[annHora]+')</h3>'+
  '<div style="font-size:12px;color:#1a1a2e;margin-top:.4rem;font-weight:600">'+annHoraData.title+'</div>'+
  '<div style="font-size:12px;color:#444;margin-top:.4rem;line-height:1.7">'+annHoraData.desc+'</div>'+
  '<div style="font-size:11px;color:#6b6b8a;margin-top:.5rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Annual Remedies</div>'+
  '<div style="font-size:12px;color:#444;margin-top:.3rem;line-height:1.7">'+annHoraData.remedies+'</div></div>'+
  '<div class="card"><h2>Ascendant '+lxAnk+' ('+PL[lxAnk]+') — House Analysis</h2>'+
  '<div class="db" style="margin-bottom:.75rem">The ascendant (Laxmi Ank) places each planet in a specific house. Below is the full reading for your ascendant based on what sits in each house.</div>'+
  houseH+'</div>'+
  '<div class="asc-card"><h3>Ascendant Remedies — '+PL[lxAnk]+'</h3><div style="font-size:12px;color:#333;margin-top:.4rem;line-height:1.8">'+ascRem.split('. ').map(function(s){return s.trim()?'• '+s:''}).join('<br>')+'</div></div>';
}

  '• Chant "Siddhi [planet name]" for 3 mins each (27 mins total) for 21 days for any troubling planet.<br>'+
  '• Chant Rohineesh to energize Chandrma so you shine in the world.<br>'+
  '• Visit mandir and sit for at least 30 mins, absorbing the vibrations of the holy place.<br>'+
  '• All Gayatri Mantras: if unable to chant all year round, then at least from date of birth to 45 days, they should be chanted.'+
  '</div></div>'+
  '<div class="card"><h2>Switchwords — Chant 3 times a day, 5 mins each, before 8am</h2>'+
  '<div class="db" style="margin-bottom:.75rem">Do NOT use in the bathroom or during menstrual cycle. Can chant while walking or driving.</div>'+
  '<div>'+swH+'</div></div>';
}
